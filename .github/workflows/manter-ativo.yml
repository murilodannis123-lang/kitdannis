# Mantém o banco do KitDannis (Supabase, plano grátis) ativo.
# O Supabase pausa projetos grátis com pouca atividade no banco em 7 dias
# ("algumas requisições por dia" costumam bastar). Esta rotina roda 2 vezes por dia
# e faz consultas leves. A chave usada é a "publishable", que já é pública no
# config.js e não dá acesso a nenhum dado (o banco só libera dados com login).
name: Manter banco ativo

on:
  schedule:
    - cron: "23 11,23 * * *"   # todo dia, por volta das 8h23 e 20h23 de Brasília
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas leves no Supabase
        run: |
          URL="https://yhxdljexzmmihpevmlfr.supabase.co"
          KEY="sb_publishable_jLsUpLp-8uN3EfhWRwi62A_bZX1QuYP"
          falhas=0
          for tabela in config gastos notas; do
            status=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
              "$URL/rest/v1/$tabela?select=*&limit=1" -H "apikey: $KEY") || status=000
            echo "$tabela: $status"
            [ "$status" = "200" ] || falhas=$((falhas+1))
          done
          status=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" "$URL/auth/v1/health" -H "apikey: $KEY") || status=000
          echo "auth: $status"
          [ "$status" = "200" ] || falhas=$((falhas+1))
          if [ "$falhas" -gt 0 ]; then
            echo "::error::O banco não respondeu. Pode ter sido pausado: entre no painel do Supabase e clique em Resume project."
            exit 1
          fi
